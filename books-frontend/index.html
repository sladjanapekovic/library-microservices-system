<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Books Frontend</title>
</head>
<body>

  <h1>Books</h1>

  <h3>Add Book</h3>
  <input id="title" placeholder="Title" />
  <input id="author" placeholder="Author" />
  <input id="genre" placeholder="Genre" />
  <input id="copies" placeholder="Copies" type="number" />
  <button onclick="addBook()">Add</button>

  <h3>All Books</h3>
  <button onclick="loadBooks()">Refresh</button>
  <ul id="booksList"></ul>

  <script src="app.js"></script>
</body>
</html>
