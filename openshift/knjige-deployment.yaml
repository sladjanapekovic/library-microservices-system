apiVersion: apps/v1
kind: Deployment
metadata:
  name: knjige-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knjige-postgres
  template:
    metadata:
      labels:
        app: knjige-postgres
    spec:
      containers:
        - name: knjige-postgres
          image: bitnami/postgresql:15
          env:
            - name: POSTGRESQL_USERNAME
              value: postgres
            - name: POSTGRESQL_PASSWORD
              value: postgres
            - name: POSTGRESQL_DATABASE
              value: knjige_db
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: knjige-postgres
spec:
  selector:
    app: knjige-postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knjige-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knjige-service
  template:
    metadata:
      labels:
        app: knjige-service
    spec:
      containers:
        - name: knjige-service
          image: sladjanapekovic/knjige-service:v5
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@knjige-postgres:5432/knjige_db
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: knjige-service
spec:
  selector:
    app: knjige-service
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      targetPort: 8000
