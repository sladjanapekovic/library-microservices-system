apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-gateway
  template:
    metadata:
      labels:
        app: web-gateway
    spec:
      containers:
        - name: web-gateway
          image: sladjanapekovic/web-gateway:latest
          imagePullPolicy: Always
          env:
            - name: KNJIGE_SERVICE_URL
              value: http://knjige-service:8000
            - name: IZPOSOJA_SERVICE_URL
              value: http://izposoja-service:8082
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: web-gateway
spec:
  selector:
    app: web-gateway
  ports:
    - port: 3000
      targetPort: 3000
