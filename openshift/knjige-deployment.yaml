apiVersion: apps/v1
kind: Deployment
metadata:
  name: knjige-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knjige-service
  template:
    metadata:
      labels:
        app: knjige-service
    spec:
      containers:
        - name: knjige-service
          image: sladjanapekovic/knjige-service:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: knjige-service
spec:
  selector:
    app: knjige-service
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
