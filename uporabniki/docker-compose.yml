version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: uporabniki-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uporabniki_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  uporabniki-service:
    build: .
    container_name: uporabniki-service
    ports:
      - "50051:50051"
    depends_on:
      - postgres

volumes:
  postgres_data:
