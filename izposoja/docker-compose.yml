services:
  postgres:
    image: postgres:15
    container_name: izposoja-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: izposoja_db
    ports:
      - "5433:5432"
    volumes:
      - izposoja_postgres_data:/var/lib/postgresql/data

  activemq:
    image: symptoma/activemq:latest
    container_name: izposoja-activemq
    environment:
      ACTIVEMQ_ADMIN_LOGIN: admin
      ACTIVEMQ_ADMIN_PASSWORD: admin
    ports:
      - "61616:61616"
      - "8161:8161"

  izposoja-service:
    build: .
    container_name: izposoja-service
    ports:
      - "8082:8082"
    depends_on:
      - postgres
      - activemq

volumes:
  izposoja_postgres_data:
